// 루트 프로젝트: 공통 설정만
plugins {
    id 'java'
    id 'checkstyle'
    id "com.diffplug.spotless" version "8.1.0"
}

allprojects {
    group = 'org.giglab'
    version = '0.0.1-SNAPSHOT'
    
    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'checkstyle'
    apply plugin: 'com.diffplug.spotless'
    
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }
    
    checkstyle {
        toolVersion = "10.12.1"
        configFile = file("$rootDir/config/checkstyle/checkstyle.xml")
        ignoreFailures = false
    }
    
    spotless {
        java {
            target 'src/**/*.java'
            googleJavaFormat("1.33.0")
            removeUnusedImports()
            trimTrailingWhitespace()
            endWithNewline()
        }

        format 'misc', {
            target '*.md', '.gitignore'
            trimTrailingWhitespace()
            indentWithSpaces(4)
            endWithNewline()
        }

        // Gradle 파일은 최소한의 포맷팅만 적용
        format 'gradle', {
            target '*.gradle'
            trimTrailingWhitespace()
            endWithNewline()
        }
    }
    
    tasks.named('test') {
        useJUnitPlatform()
    }
    
    // 빌드 시 코드 품질 체크 (체크 실패 시 빌드 실패)
    tasks.named('build') {
        dependsOn 'spotlessCheck'
        dependsOn 'checkstyleMain'
    }
}
