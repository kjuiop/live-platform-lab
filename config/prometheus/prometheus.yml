global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'live-platform-app'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: [ 'live-chat-server:8080' ]
  - job_name: 'redis'
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: [ 'redis_exporter:9121' ]